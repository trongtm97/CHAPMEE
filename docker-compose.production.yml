# ChapMee production stack (VPS Vietnix).
# Usage: docker compose -f docker-compose.production.yml --env-file .env.production up -d
# Guide: docs/DOCKER_COMPOSE_PRODUCTION_GUIDE.md
# NEVER: docker compose down -v  (deletes postgres_data, minio_data, etc.)

name: chapmee

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4096}
        NEXT_PUBLIC_S3_MEDIA_PUBLIC_BASE_URL: ${NEXT_PUBLIC_S3_MEDIA_PUBLIC_BASE_URL:?set NEXT_PUBLIC_S3_MEDIA_PUBLIC_BASE_URL in .env.production}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://chapmee.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://chapmee.com}
    container_name: chapmee-web
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      postgrest:
        condition: service_started
    expose:
      - "3000"
    # Postfix on VPS host — SMTP via host.docker.internal (see scripts/deploy/setup-postfix-mail.sh)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - chapmee_net

  postgres:
    image: postgres:16-alpine
    container_name: chapmee-postgres
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chapmee_net

  redis:
    image: redis:7-alpine
    container_name: chapmee-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - chapmee_net

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: chapmee-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: false
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,auth
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?set POSTGREST_JWT_SECRET in .env.production}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://chapmee.com/api/postgrest
    expose:
      - "3000"
    networks:
      - chapmee_net

  caddy:
    image: caddy:2-alpine
    container_name: chapmee-caddy
    restart: unless-stopped
    depends_on:
      - web
      - postgrest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chapmee_net

networks:
  chapmee_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
